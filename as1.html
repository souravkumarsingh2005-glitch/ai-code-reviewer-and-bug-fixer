import asyncio, logging
from db import get_connection
from typing import Dict, Any

logger = logging.getLogger("settlement")
balances: Dict[str, float] = {"ACC-9041": 500000.0, "ACC-1022": 1200000.0}
_transfer_lock = asyncio.Lock()

async def process_wire_transfer(account_id: str, target_id: str, amount: float, auth_pin: str) -> Dict[str, Any]:
    if amount <= 0:
        raise ValueError("Transfer amount must be positive")

    conn = get_connection()
    cursor = conn.cursor()

    # FIXED: the values are bound as parameters, so they can never be read as SQL
    query = "SELECT balance, status FROM accounts WHERE acc_id = %s AND pin_hash = crypt(%s, pin_hash)"
    cursor.execute(query, (account_id, auth_pin))
    record = cursor.fetchone()
    if not record or record[1] != 'ACTIVE':
        raise PermissionError("Wrong credentials, or the account is not active")

    # FIXED: the pin never reaches the log; the account is masked
    logger.info("Starting transfer for account ***%s, amount %.2f", account_id[-4:], amount)

    # FIXED: the check and the write happen inside one lock, so two requests cannot interleave
    async with _transfer_lock:
        current_balance = balances.get(account_id, 0.0)
        if current_balance < amount:
            raise ValueError("Insufficient funds")

        await asyncio.sleep(0.05)
        balances[account_id] = current_balance - amount
        balances[target_id] = balances.get(target_id, 0.0) + amount

        try:
            update_query = "UPDATE accounts SET balance = balance - %s WHERE acc_id = %s"
            cursor.execute(update_query, (amount, account_id))
            conn.commit()
        except Exception as db_err:
            conn.rollback()
            balances[account_id] = current_balance
            balances[target_id] -= amount
            logger.error("Rolled back after a database failure: %s", str(db_err))

import jwt from 'jsonwebtoken';

interface SessionEntry {
  email: string;
  roles: string[];
  expiresAt: number;
}

// FIXED: the cache is bounded and entries expire
const MAX_CACHE_SIZE = 10000;
const SESSION_TTL_MS = 15 * 60 * 1000;
const activeSessionCache = new Map<string, SessionEntry>();

// FIXED: no nested repetition, so matching time grows linearly with input length
const SAFE_EMAIL_REGEX = /^[a-zA-Z0-9.!#$%&'*+/=?^_\`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*$/;

export async function verifyAndCacheSession(token: string, userEmail: string, jwtSecret: string): Promise<boolean> {
  if (!userEmail || userEmail.length > 254 || !SAFE_EMAIL_REGEX.test(userEmail)) {
    throw new Error("That email address is not valid");
  }

  // FIXED: verify checks the signature and rejects a forged token
  let verifiedPayload: any;
  try {
    verifiedPayload = jwt.verify(token, jwtSecret, {
      algorithms: ['RS256', 'ES256'],
      issuer: 'https://auth.internal.example'
    });
  } catch (err) {
    return false;
  }

  if (activeSessionCache.size >= MAX_CACHE_SIZE) {
    const oldestKey = activeSessionCache.keys().next().value;
    if (oldestKey) activeSessionCache.delete(oldestKey);
  }

  activeSessionCache.set(verifiedPayload.sub, {
    email: userEmail,
    roles: verifiedPayload.roles || [],
    expiresAt: Date.now() + SESSION_TTL_MS
  });

  return true;
}`,

        osc.frequency.exponentialRampToValueAtTime(460, ctx.currentTime + 0.35);
        gain.gain.setValueAtTime(0.0001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.55);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.6);
        setTimeout(() => ctx.close(), 700);
      } catch (e) { /* audio unavailable in this environment */ }
    }

    function buildScanLog(file) {
      const totalLines = file.code.split('\n').length;
      const log = [];
      log.push('$ veritas scan --target ' + file.name);
      log.push('booting static analysis engine…');
      log.push('loading ruleset: injection · race-conditions · secrets · xss · logging · regex-dos');
      log.push('reading ' + totalLines + ' lines from ' + file.name);
      file.findings.forEach(f => {
        log.push('line ' + f.line + ': checking against ' + f.cwe +
          ' — ' + (f.resolved ? 'CLEAR (patched)' : 'FLAGGED (' + f.severity.toUpperCase() + ')'));
      });
      const openN = file.findings.filter(f => !f.resolved).length;
      log.push(openN === 0
        ? 'scan complete — ' + file.findings.length + ' rule hits, all resolved'
        : 'scan complete — ' + file.findings.length + ' rule hits, ' + openN + ' still open');
      return log;
    }

    function ScoreDial({ score, resolved, total }) {
      const r = 34;
      const c = 2 * Math.PI * r;
      const tone = score >= 85 ? '#2ECC71' : score >= 60 ? '#FF9900' : '#00A8E1';
      return (
        <div className="flex items-center gap-4">
          <div className="relative w-[84px] h-[84px] shrink-0">
            <svg viewBox="0 0 84 84" className="w-full h-full">
              <circle cx="42" cy="42" r={r} fill="none" stroke="#212D38" strokeWidth="6" />
              <circle
                cx="42" cy="42" r={r} fill="none" stroke={tone} strokeWidth="6" strokeLinecap="round"
                strokeDasharray={c} strokeDashoffset={c - (c * score) / 100}
                transform="rotate(-90 42 42)"
                style={{ transition: 'stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)' }}
              />
            </svg>
            <div className="absolute inset-0 flex flex-col items-center justify-center">
              <span className="font-mono text-xl font-medium leading-none" style={{ color: tone }}>{score}</span>
              <span className="text-[9px] text-fog-500 mt-0.5">MATCH</span>
            </div>
          </div>
          <div className="space-y-1.5 text-[13px] text-fog-300">
            <div className="flex items-center gap-2">
              <span className="w-1.5 h-1.5 rounded-full bg-emerald"></span>
              <span>{resolved} of {total} fixed</span>
            </div>
            <div className="flex items-center gap-2">
              <span className="w-1.5 h-1.5 rounded-full bg-amber"></span>
              <span>Reviewed line by line</span>
            </div>
            <div className="flex items-center gap-2">
              <span className="w-1.5 h-1.5 rounded-full bg-frost"></span>
              <span>Nothing leaves this page</span>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [files, setFiles] = useState(SAMPLE_FILES);
      const [activeFileId, setActiveFileId] = useState(SAMPLE_FILES[0].id);
      const [view, setView] = useState('split');
      const [tab, setTab] = useState('scanner');

      const [pastedCode, setPastedCode] = useState(STARTER_CODE);
      const [pastedLang, setPastedLang] = useState('javascript');
      const [isPasteMode, setIsPasteMode] = useState(false);

      const [isScanning, setIsScanning] = useState(false);
      const [progress, setProgress] = useState(100);
      const [showExploit, setShowExploit] = useState(false);
      const [showSubmission, setShowSubmission] = useState(false);
      const [toast, setToast] = useState(null);
      const [myList, setMyList] = useState({});
      const [rating, setRating] = useState({});
      const [editableFiles, setEditableFiles] = useState({});
      const [searchQuery, setSearchQuery] = useState('');
      const [compileTime, setCompileTime] = useState(null);
      const [soundOn, setSoundOn] = useState(true);
      const [consoleLines, setConsoleLines] = useState([]);

      const say = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 2600);
      };

      const current = useMemo(() => {
        if (isPasteMode) {
          const scan = scanPastedCode(pastedCode);
          const ext = pastedLang === 'python' ? 'py' : pastedLang === 'typescript' ? 'ts' : 'js';
          return {
            id: 'pasted',
            name: 'your-code.' + ext,
            lang: pastedLang,
            badge: 'Your code',
            maturity: scan.findings.length ? 'CRIT' : 'CLR',
            code: pastedCode,
            fixed: scan.fixedCode,
            findings: scan.findings.map(f => ({ ...f, resolved: false })),
            unitTests: scan.findings.length
              ? "// Write one test per finding. A test that fails before the fix\n// and passes after it is the only proof the fix worked.\n\ntest('rejects an injected account id', () => {\n  expect(() => authenticateUser(\"x' OR 1=1 --\", 'any')).toThrow();\n});"
              : "// Nothing matched, so there is nothing to write a regression test for yet.",
            exploitPoC: scan.findings.length
              ? "# What an attacker would send to the code above.\ncurl -X POST /api/login \\\n  -d '{\"userInput\": \"admin'\\''--\", \"userPassword\": \"anything\"}'\n\n# The comment marker ends the query early, so the pin is never checked."
              : "# Nothing matched the checks, so there is no exploit to show.\n# That is not the same as the code being safe — these are five\n# pattern checks, not a full review."
          };
        }
        return files.find(f => f.id === activeFileId) || files[0];
      }, [files, activeFileId, isPasteMode, pastedCode, pastedLang]);

      useEffect(() => {
        setConsoleLines([]);
        setCompileTime(null);
      }, [current.id]);

      const openCount = current.findings.filter(f => !f.resolved).length;
      const fixedCount = current.findings.length - openCount;

      const score = useMemo(() => {
        if (current.findings.length === 0) return 100;
        if (openCount === 0) return 97;
        const weight = { critical: 24, high: 14, medium: 7, low: 3 };
        const lost = current.findings
          .filter(f => !f.resolved)
          .reduce((n, f) => n + (weight[f.severity] || 5), 0);
        return Math.max(22, 100 - lost);
      }, [current, openCount]);

      const runReview = () => {
        setIsScanning(true);
        setProgress(18);
        setCompileTime(null);
        setConsoleLines([]);
        const t0 = performance.now();
        const lines = current.code.split('\n').length;
        const log = buildScanLog(current);
        const step = 130;
        log.forEach((entry, idx) => {
          setTimeout(() => setConsoleLines(prev => [...prev, entry]), step * (idx + 1));
        });
        const totalDuration = step * log.length + 380;
        setTimeout(() => setProgress(58), Math.min(260, totalDuration * 0.35));
        setTimeout(() => setProgress(88), Math.min(560, totalDuration * 0.75));
        setTimeout(() => {
          setProgress(100);
          setIsScanning(false);
          const elapsed = performance.now() - t0;
          const simulated = Math.round(lines * (2.1 + Math.random() * 1.4) + elapsed * 0.15);
          setCompileTime(simulated);
          say(openCount === 0 ? 'Nothing left to flag on this file.' : 'Found ' + openCount + ' things worth looking at.');
          if (openCount > 0 && soundOn) playBell();
        }, totalDuration);
      };

      const handleCodeChange = (newCode) => {
        if (isPasteMode) { setPastedCode(newCode); return; }
        if (!editableFiles[activeFileId]) return;
        setFiles(prev => prev.map(f => f.id === activeFileId ? { ...f, code: newCode } : f));
      };

      const canEditCurrent = isPasteMode || !!editableFiles[activeFileId];

      const toggleEditCurrent = () => {
        if (isPasteMode) return;
        setEditableFiles(prev => ({ ...prev, [activeFileId]: !prev[activeFileId] }));
        say(editableFiles[activeFileId] ? 'Editing locked for this file.' : 'Editing unlocked — go ahead and change the code.');
      };

      const filteredFindings = useMemo(() => {
        if (!searchQuery.trim()) return current.findings;
        const q = searchQuery.toLowerCase();
        return current.findings.filter(f =>
          f.title.toLowerCase().includes(q) ||
          f.impact.toLowerCase().includes(q) ||
          f.recommendation.toLowerCase().includes(q) ||
          f.cwe.toLowerCase().includes(q) ||
          String(f.line).includes(q)
        );
      }, [current.findings, searchQuery]);

      const lineMatchesSearch = (line) => {
        if (!searchQuery.trim()) return false;
        return line.toLowerCase().includes(searchQuery.toLowerCase());
      };

      const applyOne = (findingId) => {
        if (isPasteMode) {
          setPastedCode(current.fixed);
          say('Applied. Have a look at what changed.');
          return;
        }
        setFiles(prev => prev.map(f => {
          if (f.id !== activeFileId) return f;
          const updated = f.findings.map(i => i.id === findingId ? { ...i, resolved: true } : i);
          return { ...f, findings: updated, code: updated.every(i => i.resolved) ? f.fixed : f.code };
        }));
        say('Fix applied.');
      };

      const applyAll = () => {
        if (isPasteMode) {
          setPastedCode(current.fixed);
          say('Every suggested change is in the editor now.');
          return;
        }
        setFiles(prev => prev.map(f =>
          f.id !== activeFileId ? f : { ...f, code: f.fixed, findings: f.findings.map(i => ({ ...i, resolved: true })) }
        ));
        setView('split');
        say('Every suggested change is in.');
      };

      const copy = (text, label) => {
        navigator.clipboard.writeText(text)
          .then(() => say(label + ' copied.'))
          .catch(() => say('Copying is blocked here — select the text instead.'));
      };

      const downloadPatch = () => {
        const body = '--- a/' + current.name + '\n+++ b/' + current.name + '\n@@\n' +
          current.fixed.split('\n').map(l => '+' + l).join('\n');
        const url = URL.createObjectURL(new Blob([body], { type: 'text/x-diff' }));
        const a = document.createElement('a');
        a.href = url;
        a.download = current.name + '.patch';
        a.click();
        URL.revokeObjectURL(url);
        say('Patch file downloaded.');
      };

      const exportReport = () => {
        const data = {
          reviewedFile: current.name,
          language: current.lang,
          score: score,
          fixed: fixedCount,
          stillOpen: openCount,
          findings: current.findings,
          note: 'This is a pattern-based review. Confirm each finding before acting on it.',
          author: 'Sourav Kumar Singh',
          repository: 'https://github.com/souravkumarsingh2005-glitch/veritas-enterprise-ai'
        };
        const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
        const a = document.createElement('a');
        a.href = url;
        a.download = 'review-' + current.name + '.json';
        a.click();
        URL.revokeObjectURL(url);
        say('Report saved.');
      };

      const toggleMyList = () => {
        setMyList(prev => ({ ...prev, [current.id]: !prev[current.id] }));
        say(myList[current.id] ? 'Removed from My List.' : 'Added to My List.');
      };

      const share = () => {
        copy(window.location.href.split('#')[0] + '#' + current.id, 'Link');
      };

      const rate = (val) => {
        setRating(prev => ({ ...prev, [current.id]: val }));
        say(val === 'up' ? 'Thanks — more like this.' : 'Got it — fewer like this.');
      };

      const severityStyle = (s) =>
        s === 'critical' ? 'text-danger border-danger/50 bg-danger/10'
        : s === 'high'   ? 'text-amber border-amber/40 bg-amber/10'
        : s === 'medium' ? 'text-frost border-frost/40 bg-frost/10'
        : 'text-fog-300 border-fog-500/30 bg-fog-500/10';

      const inMyList = !!myList[current.id];
      const myRating = rating[current.id];

      return (
        <div className="flex-1 flex flex-col min-h-screen">

          <header className="sticky top-0 z-40 bg-void-950/94 backdrop-blur-xl border-b border-white/[0.07] px-4 sm:px-8 py-3">
            <div className="max-w-[1400px] mx-auto flex items-center justify-between gap-4">
              <div className="flex items-center gap-6">
                <div className="flex items-center gap-2.5">
                  <div className="w-8 h-8 rounded-lg bg-primeblue/15 border border-primeblue/40 flex items-center justify-center">
                    <svg viewBox="0 0 24 24" className="w-[18px] h-[18px] text-primeblue" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                      <circle cx="12" cy="12" r="8.5"/>
                      <circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/>
                      <path d="M12 3.5v2.4M12 18.1v2.4M20.5 12h-2.4M5.9 12H3.5"/>
                    </svg>
                  </div>
                  <div className="leading-none">
                    <h1 className="wordmark text-[22px] text-white leading-none">veritas</h1>
                    <svg viewBox="0 0 70 10" className="w-[70px] h-[10px] mt-0.5">
                      <path d="M2 2 C 20 9, 50 9, 66 2" fill="none" stroke="#FF9900" strokeWidth="2" strokeLinecap="round"/>
                      <path d="M60 0.5 L67 2 L61 5.5" fill="none" stroke="#FF9900" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
                    </svg>
                  </div>
                </div>
                <nav className="hidden lg:flex items-center gap-5 text-[13.5px] text-fog-300">
                  <span className="text-white font-medium">Review</span>
                  <span className="hover:text-white transition-colors cursor-default">Findings</span>
                  <span className="hover:text-white transition-colors cursor-default">Scanner</span>
                  <span className="hover:text-white transition-colors cursor-default">My List</span>
                </nav>
              </div>

              <div className="flex items-center gap-3">
                <button className="hidden md:flex items-center justify-center w-8 h-8 rounded text-fog-300 hover:text-white transition-colors">
                  <Icon.Search className="w-[18px] h-[18px]" />
                </button>
                <button onClick={() => { setSoundOn(v => !v); say(soundOn ? 'Bug alerts muted.' : 'Bug alerts on — you\'ll hear a chime on every scan with findings.'); }}
                  title={soundOn ? 'Mute bug alert sound' : 'Unmute bug alert sound'}
                  className={'hidden md:flex items-center justify-center w-8 h-8 rounded transition-colors relative ' + (soundOn ? 'text-fog-300 hover:text-white' : 'text-fog-500/50')}>
                  <Icon.Bell className="w-[18px] h-[18px]" />
                  {soundOn && openCount > 0 && (
                    <span className="absolute -top-0.5 -right-0.5 w-2 h-2 rounded-full bg-danger pulse-live"></span>
                  )}
                </button>
                <button onClick={() => setShowExploit(true)}
                  className="px-3 py-1.5 rounded text-[13px] font-medium text-white bg-danger hover:bg-danger/80 transition-colors flex items-center gap-1.5">
                  <Icon.Bolt className="w-3.5 h-3.5" />
                  Run exploit
                </button>
                <button onClick={() => setShowSubmission(true)}
                  className="px-3.5 py-1.5 rounded text-[13px] font-medium text-void-950 bg-fog-100 hover:bg-white transition-colors">
                  Submission
                </button>
              </div>
            </div>
          </header>

          <section className="relative border-b border-white/[0.07] px-4 sm:px-8 pt-10 pb-8 overflow-hidden">
            <div className="pointer-events-none absolute inset-0 bg-gradient-to-b from-primeblue/[0.08] via-transparent to-transparent"></div>
            <div className="pointer-events-none absolute -top-16 -left-10 w-72 h-72 rounded-full bg-primeblue/15 glow-blob"></div>
            <div className="pointer-events-none absolute -top-24 right-10 w-80 h-80 rounded-full bg-frost/10 glow-blob" style={{ animationDelay: '3s' }}></div>
            <div className="relative max-w-[1400px] mx-auto flex flex-col lg:flex-row lg:items-end justify-between gap-8">
              <div className="max-w-xl">
                <div className="flex items-center gap-2 mb-3">
                  <span className="px-1.5 py-0.5 rounded-sm text-[10px] font-bold tracking-wide bg-fog-100 text-void-950">
                    {current.maturity || 'CRIT'}
                  </span>
                  <span className="text-[12px] text-fog-500">Security review · {current.lang}</span>
                </div>
                <h2 className="text-[34px] sm:text-[44px] leading-[1.05] text-white mb-3">
                  The bugs you'd rather not find in production
                </h2>
                <p className="text-[15px] text-fog-300 leading-relaxed mb-5">
                  Paste a file, or open one of the two below. Veritas points at the line, says what
                  could go wrong in plain terms, and shows you the version that fixes it.
                </p>
                <div className="flex items-center gap-2.5">
                  <button onClick={runReview} disabled={isScanning}
                    className="flex items-center gap-2 px-5 py-2 rounded text-[14px] font-semibold text-void-950 bg-white hover:bg-fog-100 disabled:opacity-50 transition-colors">
                    <Icon.Play className="w-4 h-4" />
                    {isScanning ? 'Reading…' : 'Run the review'}
                  </button>
                  <button onClick={toggleMyList}
                    className="flex items-center justify-center w-9 h-9 rounded-full border-2 border-fog-500 text-fog-100 hover:border-white transition-colors">
                    {inMyList ? <Icon.Check className="w-4 h-4" /> : <Icon.Plus className="w-4 h-4" />}
                  </button>
                  <button onClick={() => rate('up')}
                    className={'flex items-center justify-center w-9 h-9 rounded-full border-2 transition-colors ' + (myRating === 'up' ? 'border-white text-white' : 'border-fog-500 text-fog-100 hover:border-white')}>
                    <Icon.Thumb className="w-4 h-4" />
                  </button>
                  <button onClick={() => rate('down')}
                    className={'flex items-center justify-center w-9 h-9 rounded-full border-2 transition-colors scale-y-[-1] ' + (myRating === 'down' ? 'border-white text-white' : 'border-fog-500 text-fog-100 hover:border-white')}>
                    <Icon.Thumb className="w-4 h-4" />
                  </button>
                  <button onClick={share}
                    className="flex items-center justify-center w-9 h-9 rounded-full border-2 border-fog-500 text-fog-100 hover:border-white transition-colors">
                    <Icon.Share className="w-4 h-4" />
                  </button>
                </div>
              </div>
              <div className="panel rounded-xl px-5 py-4 shrink-0">
                <ScoreDial score={score} resolved={fixedCount} total={current.findings.length} />
              </div>
            </div>
          </section>

          <main className="flex-1 px-4 sm:px-8 py-6 max-w-[1400px] mx-auto w-full space-y-4">

            <div className="flex flex-wrap items-center justify-between gap-3">
              <div className="flex flex-wrap items-center gap-2">
                <span className="text-[11px] uppercase tracking-wide text-fog-500 mr-1 hidden sm:inline">Continue reviewing</span>
                {files.map(f => {
                  const on = !isPasteMode && f.id === activeFileId;
                  const dirty = f.findings.some(i => !i.resolved);
                  return (
                    <button key={f.id}
                      onClick={() => { setIsPasteMode(false); setActiveFileId(f.id); }}
                      className={'card-hover flex items-center gap-2 px-3 py-1.5 rounded text-[13px] font-mono transition-colors border ' +
                        (on ? 'bg-void-700 text-white border-primeblue/60' : 'bg-void-800/60 text-fog-500 border-white/[0.07] hover:text-fog-100 hover:border-white/20')}>
                      <span className={'w-1.5 h-1.5 rounded-full ' + (dirty ? 'bg-primeblue' : 'bg-emerald')}></span>
                      {f.name}
                    </button>
                  );
                })}
                <button onClick={() => setIsPasteMode(true)}
                  className={'card-hover px-3 py-1.5 rounded text-[13px] transition-colors border ' +
                    (isPasteMode ? 'bg-void-700 text-white border-primeblue/60' : 'bg-void-800/60 text-fog-500 border-white/[0.07] hover:text-fog-100 hover:border-white/20')}>
                  + Paste your own
                </button>
              </div>

              <div className="flex flex-wrap items-center gap-2">
                <div className="flex items-center gap-1.5 px-2.5 py-1.5 rounded border border-white/[0.07] bg-void-800/60 focus-within:border-primeblue/50 transition-colors">
                  <Icon.Search className="w-3.5 h-3.5 text-fog-500 shrink-0" />
                  <input
                    value={searchQuery}
                    onChange={e => setSearchQuery(e.target.value)}
                    placeholder="Search findings or code…"
                    className="bg-transparent text-[13px] text-fog-100 placeholder:text-fog-500 focus:outline-none w-[150px]"
                  />
                  {searchQuery && (
                    <button onClick={() => setSearchQuery('')} className="text-fog-500 hover:text-white text-[13px] leading-none">×</button>
                  )}
                </div>
                {!isPasteMode && (
                  <button onClick={toggleEditCurrent}
                    className={'px-3 py-1.5 rounded text-[13px] border transition-colors ' +
                      (canEditCurrent ? 'text-emerald border-emerald/40 bg-emerald/10' : 'text-fog-300 border-white/[0.07] hover:border-white/20')}>
                    {canEditCurrent ? 'Editing unlocked' : 'Enable editing'}
                  </button>
                )}
                {isPasteMode && (
                  <select value={pastedLang} onChange={e => setPastedLang(e.target.value)}
                    className="bg-void-800 border border-white/10 rounded px-2.5 py-1.5 text-[13px] text-fog-300 focus:outline-none">
                    <option value="javascript">JavaScript</option>
                    <option value="python">Python</option>
                    <option value="typescript">TypeScript</option>
                  </select>
                )}
                <div className="flex items-center gap-0.5 p-0.5 rounded border border-white/[0.07] text-[13px]">
                  <button onClick={() => setView('editor')}
                    className={'px-2.5 py-1 rounded transition-colors ' + (view === 'editor' ? 'bg-void-700 text-white' : 'text-fog-500 hover:text-fog-100')}>
                    Editor
                  </button>
                  <button onClick={() => setView('split')}
                    className={'px-2.5 py-1 rounded transition-colors ' + (view === 'split' ? 'bg-void-700 text-white' : 'text-fog-500 hover:text-fog-100')}>
                    Before and after
                  </button>
                </div>
                <button onClick={downloadPatch}
                  className="flex items-center gap-1.5 px-3 py-1.5 rounded text-[13px] text-fog-300 border border-white/[0.07] hover:border-white/20 transition-colors">
                  <Icon.Download className="w-3.5 h-3.5" />
                  Patch
                </button>
                <button onClick={() => copy(current.fixed, 'Fixed code')}
                  className="flex items-center gap-1.5 px-3 py-1.5 rounded text-[13px] text-fog-300 border border-white/[0.07] hover:border-white/20 transition-colors">
                  <Icon.Copy className="w-3.5 h-3.5" />
                  Copy fixed
                </button>
                <button onClick={exportReport}
                  className="hidden sm:flex items-center gap-1.5 px-3 py-1.5 rounded text-[13px] text-fog-300 border border-white/[0.07] hover:border-white/20 transition-colors">
                  <Icon.Info className="w-3.5 h-3.5" />
                  Save report
                </button>
              </div>
            </div>

            {isScanning && (
              <div className="w-full h-[3px] rounded-full bg-void-700 overflow-hidden">
                <div className="h-full bg-primeblue transition-all duration-300" style={{ width: progress + '%' }}></div>
              </div>
            )}

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-4">

              <div className="lg:col-span-7 flex flex-col panel rounded-xl overflow-hidden min-h-[540px]">
                <div className="flex items-center justify-between px-4 py-2.5 border-b border-white/[0.07]">
                  <div className="flex items-center gap-2.5">
                    <span className="font-mono text-[13px] text-white">{current.name}</span>
                    <span className="text-[11px] px-2 py-0.5 rounded bg-void-700 text-fog-500 border border-white/[0.07]">
                      {current.badge}
                    </span>
                  </div>
                  <div className="flex items-center gap-3">
                    {compileTime !== null && (
                      <span className="flex items-center gap-1.5 text-[11px] font-mono text-frost">
                        <Icon.Bolt className="w-3 h-3" />
                        Compiled in {compileTime}ms
                      </span>
                    )}
                    <span className="text-[11px] text-fog-500">
                      {canEditCurrent ? 'Editable — type and it re-scans' : 'Read only'}
                    </span>
                  </div>
                </div>

                {isScanning && (
                  <div className="relative h-0">
                    <div className="absolute left-0 right-0 h-8 bg-gradient-to-b from-primeblue/25 via-primeblue/5 to-transparent"
                      style={{ top: 0, animation: 'sweepDown 1.1s linear infinite' }}></div>
                  </div>
                )}

                {view === 'split' ? (
                  <div className="flex-1 grid grid-cols-1 md:grid-cols-2 divide-y md:divide-y-0 md:divide-x divide-white/[0.07] overflow-hidden font-mono text-[12px]">
                    <div className="flex flex-col overflow-hidden">
                      <div className="px-3 py-1.5 border-b border-white/[0.07] text-[11px] text-danger flex justify-between">
                        <span>As written</span>
                        <span className="text-fog-500">{current.code.split('\n').length} lines</span>
                      </div>
                      <div className="flex-1 py-2 overflow-auto leading-[19px]">
                        {current.code.split('\n').map((line, i) => {
                          const flagged = current.findings.some(f => !f.resolved && f.line === i + 1);
                          const hit = lineMatchesSearch(line);
                          return (
                            <div key={i} className={'flex px-2 ' + (hit ? 'bg-amber/10 border-l-2 border-amber text-white' : flagged ? 'bg-danger/10 border-l-2 border-danger text-white' : 'text-fog-300 border-l-2 border-transparent')}>
                              <span className="w-8 shrink-0 text-right pr-3 text-fog-500 select-none">{i + 1}</span>
                              <span className="whitespace-pre flex-1">{line || ' '}</span>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                    <div className="flex flex-col overflow-hidden">
                      <div className="px-3 py-1.5 border-b border-white/[0.07] text-[11px] text-emerald flex justify-between">
                        <span>Suggested</span>
                        <span className="text-fog-500">{current.fixed.split('\n').length} lines</span>
                      </div>
                      <div className="flex-1 py-2 overflow-auto leading-[19px]">
                        {current.fixed.split('\n').map((line, i) => {
                          const changed = line.includes('FIXED:');
                          const hit = lineMatchesSearch(line);
                          return (
                            <div key={i} className={'flex px-2 ' + (hit ? 'bg-amber/10 border-l-2 border-amber text-white' : changed ? 'bg-emerald/10 border-l-2 border-emerald text-white' : 'text-fog-300 border-l-2 border-transparent')}>
                              <span className="w-8 shrink-0 text-right pr-3 text-fog-500 select-none">{i + 1}</span>
                              <span className="whitespace-pre flex-1">{line || ' '}</span>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  </div>
                ) : (
                  <div className="flex-1 flex overflow-hidden font-mono text-[12px]">
                    <div className="w-11 shrink-0 border-r border-white/[0.07] py-3 text-right pr-3 select-none leading-[21px]">
                      {current.code.split('\n').map((_, i) => (
                        <div key={i} className={lineMatchesSearch(current.code.split('\n')[i]) ? 'text-amber' : current.findings.some(f => !f.resolved && f.line === i + 1) ? 'text-danger' : 'text-fog-500'}>
                          {i + 1}
                        </div>
                      ))}
                    </div>
                    <textarea
                      value={current.code}
                      readOnly={!canEditCurrent}
                      onChange={e => handleCodeChange(e.target.value)}
                      spellCheck="false"
                      placeholder="Paste a file here."
                      className={'flex-1 bg-transparent p-3 leading-[21px] focus:outline-none resize-none overflow-auto whitespace-pre ' + (canEditCurrent ? 'text-white' : 'text-fog-100')}
                    />
                  </div>
                )}

                <div className="px-4 py-3 border-t border-white/[0.07] flex items-center justify-between gap-3">
                  <span className="text-[13px] text-fog-500">
                    {openCount === 0
                      ? 'Nothing outstanding on this file.'
                      : openCount + (openCount === 1 ? ' finding' : ' findings') + ' still open'}
                  </span>
                  <button onClick={applyAll}
                    className="flex items-center gap-1.5 px-4 py-1.5 rounded text-[13px] font-medium text-void-950 bg-emerald hover:bg-emerald/85 transition-colors">
                    <Icon.Check className="w-3.5 h-3.5" />
                    Apply every fix
                  </button>
                </div>
              </div>

              <div className="lg:col-span-5 flex flex-col panel rounded-xl p-4">
                <div className="flex items-center gap-1 p-0.5 rounded border border-white/[0.07] mb-4 text-[13px]">
                  {[
                    ['scanner', 'Scanner'],
                    ['findings', searchQuery.trim() ? 'Findings (' + filteredFindings.length + ')' : (openCount > 0 ? 'Findings (' + openCount + ')' : 'Findings')],
                    ['exploit', 'The attack'],
                    ['tests', 'Tests']
                  ].map(([id, label]) => (
                    <button key={id} onClick={() => setTab(id)}
                      className={'flex-1 py-1.5 rounded transition-colors ' + (tab === id ? 'bg-void-700 text-white' : 'text-fog-500 hover:text-fog-100')}>
                      {label}
                    </button>
                  ))}
                </div>

                {tab === 'scanner' && (
                  <div className="flex-1 flex flex-col gap-3">
                    <div className="flex items-start justify-between gap-3">
                      <p className="text-[13.5px] text-fog-300 leading-relaxed">
                        A line-by-line replay of what the engine checked, in the order it checked it.
                      </p>
                      <div className="relative w-12 h-12 shrink-0">
                        <svg viewBox="0 0 48 48" className="w-full h-full">
                          <circle cx="24" cy="24" r="19" fill="none" stroke="#212D38" strokeWidth="2"/>
                          <circle cx="24" cy="24" r="13" fill="none" stroke="#212D38" strokeWidth="1"/>
                          {isScanning && (
                            <path d="M24 24 L24 5 A19 19 0 0 1 41.5 24 Z" fill="rgba(0,168,225,0.35)"
                              style={{ transformOrigin: '24px 24px', animation: 'radarSpin 1s linear infinite' }} />
                          )}
                          <circle cx="24" cy="24" r="2.5" fill={isScanning ? '#00A8E1' : '#4A5B69'} />
                        </svg>
                      </div>
                    </div>

                    <div className="flex-1 rounded-xl border border-white/[0.07] bg-void-950/85 p-3.5 font-mono text-[12px] leading-relaxed overflow-auto max-h-[420px]">
                      {consoleLines.length === 0 ? (
                        <p className="text-fog-500">Run the review to see the scanner output here.</p>
                      ) : (
                        consoleLines.map((line, i) => (
                          <div key={i} className={
                            line.includes('FLAGGED') ? 'text-danger'
                            : line.includes('CLEAR') ? 'text-emerald'
                            : line.startsWith('$') ? 'text-primeblue'
                            : 'text-fog-300'
                          }>
                            {line}
                          </div>
                        ))
                      )}
                      {isScanning && <span className="inline-block w-2 h-3.5 bg-frost align-middle ml-0.5 animate-pulse"></span>}
                    </div>

                    <button onClick={runReview} disabled={isScanning}
                      className="flex items-center justify-center gap-1.5 py-2 rounded text-[13px] font-medium text-void-950 bg-primeblue hover:bg-primeDark hover:text-white disabled:opacity-50 transition-colors">
                      <Icon.Bolt className="w-3.5 h-3.5" />
                      {isScanning ? 'Scanning…' : 'Re-run scanner'}
                    </button>
                  </div>
                )}

                {tab === 'findings' && (
                  <div className="flex-1 overflow-y-auto space-y-3 max-h-[520px] pr-1">
                    {current.findings.length === 0 || current.findings.every(f => f.resolved) ? (
                      <div className="text-center py-14 px-6 rounded-xl border border-dashed border-emerald/30">
                        <div className="mx-auto mb-3 w-10 h-10 rounded-full bg-emerald/15 flex items-center justify-center">
                          <Icon.Check className="w-5 h-5 text-emerald" />
                        </div>
                        <h4 className="text-[16px] text-white mb-1.5">Nothing left to flag</h4>
                        <p className="text-[13px] text-fog-300 leading-relaxed">
                          Every finding on this file has been addressed. That is not a clean bill of
                          health — it means these particular checks are satisfied.
                        </p>
                      </div>
                    ) : filteredFindings.length === 0 ? (
                      <div className="text-center py-14 px-6 rounded-xl border border-dashed border-white/15">
                        <h4 className="text-[16px] text-white mb-1.5">No findings match "{searchQuery}"</h4>
                        <p className="text-[13px] text-fog-300 leading-relaxed">
                          Try a shorter term, a CWE code, or a line number.
                        </p>
                      </div>
                    ) : (
                      filteredFindings.map(f => (
                        <article key={f.id}
                          className={'card-hover p-4 rounded-xl border space-y-3 animate-rise ' +
                            (f.resolved ? 'border-emerald/25 opacity-55' : 'border-white/[0.09] hover:border-white/20')}>
                          <div className="flex items-start justify-between gap-3">
                            <h4 className="text-[15px] text-white leading-snug flex-1">{f.title}</h4>
                            <span className="font-mono text-[11px] text-fog-500 shrink-0 pt-0.5">line {f.line}</span>
                          </div>

                          <div className="flex items-center gap-2 text-[11px] font-mono">
                            <span className={'px-2 py-0.5 rounded border font-bold ' + severityStyle(f.severity)}>
                              {f.severity.toUpperCase()} · {f.cvss}
                            </span>
                            <span className="px-2 py-0.5 rounded border border-white/[0.07] text-fog-500">{f.cwe}</span>
                          </div>

                          <div>
                            <div className="text-[11px] text-fog-500 mb-1">What could go wrong</div>
                            <p className="text-[13.5px] text-fog-300 leading-relaxed">{f.impact}</p>
                          </div>

                          <div className="border-l-2 border-amber pl-3">
                            <div className="text-[11px] text-fog-500 mb-1">How to fix it</div>
                            <p className="text-[13.5px] text-white leading-relaxed">{f.recommendation}</p>
                          </div>

                          <div className="pt-2 flex items-center justify-between border-t border-white/[0.06]">
                            <span className="text-[11px] font-mono text-fog-500">{f.owasp}</span>
                            {f.resolved ? (
                              <span className="flex items-center gap-1 text-[13px] text-emerald"><Icon.Check className="w-3.5 h-3.5" /> Fixed</span>
                            ) : (
                              <button onClick={() => applyOne(f.id)}
                                className="px-3 py-1 rounded text-[13px] font-medium text-void-950 bg-primeblue hover:bg-primeDark hover:text-white transition-colors">
                                Apply this fix
                              </button>
                            )}
                          </div>
                        </article>
                      ))
                    )}
                  </div>
                )}

                {tab === 'exploit' && (
                  <div className="flex-1 flex flex-col gap-3">
                    <p className="text-[13.5px] text-fog-300 leading-relaxed">
                      This is what someone would actually send. Reading it is usually faster than
                      reading the description.
                    </p>
                    <pre className="flex-1 p-3.5 rounded-xl border border-white/[0.07] bg-void-950/70 overflow-auto font-mono text-[12px] text-fog-300 leading-relaxed whitespace-pre max-h-[420px]">{current.exploitPoC}</pre>
                    <button onClick={() => copy(current.exploitPoC, 'Payload')}
                      className="flex items-center justify-center gap-1.5 py-2 rounded text-[13px] text-fog-300 border border-white/[0.07] hover:border-white/20 transition-colors">
                      <Icon.Copy className="w-3.5 h-3.5" />
                      Copy it
                    </button>
                  </div>
                )}

                {tab === 'tests' && (
                  <div className="flex-1 flex flex-col gap-3">
                    <p className="text-[13.5px] text-fog-300 leading-relaxed">
                      A test that fails on the old code and passes on the new one is the only thing
                      that proves the fix worked. Start here.
                    </p>
                    <pre className="flex-1 p-3.5 rounded-xl border border-white/[0.07] bg-void-950/70 overflow-auto font-mono text-[12px] text-fog-300 leading-relaxed whitespace-pre max-h-[420px]">{current.unitTests}</pre>
                    <button onClick={() => copy(current.unitTests, 'Tests')}
                      className="flex items-center justify-center gap-1.5 py-2 rounded text-[13px] text-void-950 bg-emerald hover:bg-emerald/85 font-medium transition-colors">
                      <Icon.Copy className="w-3.5 h-3.5" />
                      Copy the tests
                    </button>
                  </div>
                )}
              </div>
            </div>

            <p className="text-[12.5px] text-fog-500 leading-relaxed max-w-3xl pt-2">
              A note on what this is: pattern matching over the text of a file, not a compiler and not
              a proof. It will miss things, and it will occasionally flag something that is fine in
              context. Read every finding before you act on it.
            </p>
          </main>

          {showExploit && (
            <div className="fixed inset-0 z-50 bg-void-950/88 backdrop-blur-md flex items-center justify-center p-4" onClick={() => setShowExploit(false)}>
              <div className="panel rounded-2xl max-w-xl w-full p-6 space-y-4 animate-rise border-danger/30" onClick={e => e.stopPropagation()}>
                <div className="flex items-start justify-between gap-4">
                  <div>
                    <h3 className="text-[19px] text-white flex items-center gap-2">
                      <Icon.Bolt className="w-4 h-4 text-danger" />
                      Running the attack
                    </h3>
                    <p className="text-[13px] text-fog-500 mt-0.5">Against {current.name}, as it stands right now.</p>
                  </div>
                  <button onClick={() => setShowExploit(false)} className="text-fog-500 hover:text-white text-lg leading-none">×</button>
                </div>

                <div className="rounded-xl border border-white/[0.07] bg-void-950/70 p-4 font-mono text-[12px] space-y-1.5 max-h-64 overflow-auto">
                  <div className="text-fog-500">→ opening a connection</div>
                  <div className="text-danger">→ sending: ACC-9041' OR '1'='1 --</div>
                  <div className="text-fog-500">→ watching what the query returns</div>
                </div>

                {openCount > 0 ? (
                  <div className="rounded-xl border border-danger/40 bg-danger/10 p-4">
                    <p className="text-[14px] text-danger mb-1 font-medium">It worked.</p>
                    <p className="text-[13px] text-fog-300 leading-relaxed">
                      The quote closed early and the rest ran as SQL, so the credential check never
                      happened. Apply the fixes and try this again.
                    </p>
                  </div>
                ) : (
                  <div className="rounded-xl border border-emerald/40 bg-emerald/10 p-4">
                    <p className="text-[14px] text-emerald mb-1 font-medium">Nothing got through.</p>
                    <p className="text-[13px] text-fog-300 leading-relaxed">
                      The value is bound as a parameter now, so the database read it as a string —
                      just a very strange account id that matches nothing.
                    </p>
                  </div>
                )}

                <div className="flex items-center justify-between gap-3 pt-1">
                  <button onClick={applyAll}
                    className="px-4 py-2 rounded text-[13px] font-medium text-void-950 bg-emerald hover:bg-emerald/85 transition-colors">
                    Apply the fixes
                  </button>
                  <button onClick={() => setShowExploit(false)}
                    className="px-4 py-2 rounded text-[13px] text-fog-300 border border-white/[0.07] hover:border-white/20 transition-colors">
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {showSubmission && (
            <div className="fixed inset-0 z-50 bg-void-950/88 backdrop-blur-md flex items-center justify-center p-4" onClick={() => setShowSubmission(false)}>
              <div className="panel rounded-2xl max-w-xl w-full p-6 sm:p-7 space-y-5 animate-rise" onClick={e => e.stopPropagation()}>
                <div className="flex items-start justify-between gap-4">
                  <div>
                    <h3 className="text-[21px] text-white">What to hand in</h3>
                    <p className="text-[13px] text-fog-500 mt-0.5">The three things they asked for.</p>
                  </div>
                  <button onClick={() => setShowSubmission(false)} className="text-fog-500 hover:text-white text-lg leading-none">×</button>
                </div>

                <div className="space-y-4">
                  <div>
                    <div className="text-[11px] text-fog-500 mb-1.5">Repository</div>
                    <div className="font-mono text-[13px] text-white select-all break-all">
                      https://github.com/souravkumarsingh2005-glitch/veritas-enterprise-ai
                    </div>
                  </div>
                  <div className="pt-4 border-t border-white/[0.07]">
                    <div className="text-[11px] text-fog-500 mb-1.5">Live link</div>
                    <div className="font-mono text-[13px] text-white">
                      This file runs on its own — open it in any browser, or host it anywhere static.
                    </div>
                  </div>
                  <div className="pt-4 border-t border-white/[0.07]">
                    <div className="text-[11px] text-fog-500 mb-1.5">What it is</div>
                    <p className="text-[13.5px] text-fog-300 leading-relaxed">
                      A code reviewer built by <strong className="text-white font-medium">Sourav Kumar Singh</strong>.
                      It reads a file, flags injection paths, race conditions, leaked credentials and
                      runaway regexes, and shows the corrected version beside the original. You can
                      paste your own code, run the exploit to see the problem land, apply the fixes,
                      and export the whole thing as a patch or a JSON report. Built with React and
                      Tailwind in a single HTML file, with no build step and no network calls.
                    </p>
                  </div>
                </div>

                <div className="flex justify-end pt-1">
                  <button onClick={() => setShowSubmission(false)}
                    className="px-4 py-2 rounded text-[13px] font-medium text-void-950 bg-primeblue hover:bg-primeDark hover:text-white transition-colors">
                    Got it
                  </button>
                </div>
              </div>
            </div>
          )}

          {toast && (
            <div className="fixed bottom-6 right-6 z-50 panel rounded-xl px-4 py-3 text-[13px] text-white animate-rise max-w-xs border-primeblue/20">
              {toast}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
